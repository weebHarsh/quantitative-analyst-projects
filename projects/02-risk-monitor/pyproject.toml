[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rmon"
version = "0.1.0"
description = "Live risk/strategy monitor: incremental PnL attribution, equity, drawdown and markouts"
requires-python = ">=3.10"
dependencies = ["pta", "numpy>=1.26", "pandas>=2.1"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
rmon = "rmon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
